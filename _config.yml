# Jekyll konfigurace pro GitHub Pages
# Základní metadata
title: Poznámky & Návody
description: Kolekce poznámek, návodů a konfigurací pro vývoj
lang: cs

# Theme
theme: just-the-docs

# Just the Docs konfigurace
color_scheme: auto  # Automatický dark/light mode podle systému
search_enabled: true
search_tokenizer_separator: /[\s\-\.]+/

# Navigace
nav_sort: case_insensitive
nav_enabled: true

# Footer
footer_content: "Osobní poznámky a návody"

# Back to top link
back_to_top: true
back_to_top_text: "Zpět nahoru"

# Code blocks
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Soubory a složky vyloučené z publikování
exclude:
  - CLAUDE.md           # Interní instrukce pro Claude Code
  - .claude/            # Claude Code konfigurace
  - .git/
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - node_modules/
  - draft-*             # Draft soubory
  - temp-*              # Dočasné soubory
  - private/            # Soukromé poznámky

# Pluginy
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
